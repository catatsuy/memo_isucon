- name: create isucon SSH directory
  become: yes
  file:
    path: /home/isucon/.ssh
    state: directory
    owner: isucon
    group: isucon
    mode: '0700'

- name: copy isucon authorized_keys
  become: yes
  copy:
    src: authorized_keys
    dest: /home/isucon/.ssh/authorized_keys
    owner: isucon
    group: isucon
    mode: '0600'
